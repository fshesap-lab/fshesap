<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FSHesap - Admin Panel</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css">
  <!-- Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Konfigürasyon ve Admin Skriptleri -->
  <script src="config.js" defer></script>
  <script src="admin.js" defer></script>
</head>
<body>
  <nav class="container-fluid">
    <ul>
      <li><strong>FSHesap Admin Panel</strong></li>
    </ul>
    <ul>
      <li><span id="admin-user-email">Yükleniyor...</span></li>
      <li><button onclick="handleLogout()" class="secondary outline">Çıkış Yap</button></li>
    </ul>
  </nav>

  <main class="container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
      <h2>Hesap Yönetimi</h2>
      <button onclick="openAddModal()">+ Yeni Hesap Ekle</button>
    </div>

    <!-- Veri Listeleme Tablosu -->
    <figure>
      <table role="grid">
        <thead>
          <tr>
            <th>ID</th>
            <th>Hesap / Müşteri Adı</th>
            <th>E-Posta</th>
            <th>Plan</th>
            <th>Durum</th>
            <th>İşlemler</th>
          </tr>
        </thead>
        <tbody id="accounts-table-body">
          <tr>
            <td colspan="6" style="text-align: center;">Veriler yükleniyor...</td>
          </tr>
        </tbody>
      </table>
    </figure>
  </main>

  <!-- Yeni Hesap Ekleme Modalı -->
  <dialog id="account-modal">
    <article>
      <header>
        <button aria-label="Close" rel="prev" onclick="closeAddModal()"></button>
        <h3>Yeni Hesap Ekle</h3>
      </header>
      <form id="add-account-form" onsubmit="handleAddAccount(event)">
        <label for="title">Hesap/Müşteri Adı
          <input type="text" id="title" name="title" placeholder="Örn: Ahmet Yılmaz" required>
        </label>

        <label for="email">E-Posta Adresi
          <input type="email" id="email" name="email" placeholder="ornek@email.com" required>
        </label>

        <label for="plan">Plan Seçimi
          <select id="plan" name="plan" required>
            <option value="Free">Free</option>
            <option value="Pro">Pro</option>
            <option value="Enterprise">Enterprise</option>
          </select>
        </label>

        <label for="status">Durum
          <select id="status" name="status" required>
            <option value="active">Aktif</option>
            <option value="pending">Beklemede</option>
            <option value="passive">Pasif</option>
          </select>
        </label>

        <footer>
          <button type="button" class="secondary" onclick="closeAddModal()">İptal</button>
          <button type="submit">Kaydet</button>
        </footer>
      </form>
    </article>
  </dialog>
</body>
</html>
