<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FSHesap - Müşteri Paneli</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js" defer></script>
  <script src="dashboard.js" defer></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen">

  <!-- Üst Bar -->
  <header class="bg-gray-800 border-b border-gray-700 px-6 py-4 flex justify-between items-center">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center font-bold text-lg text-white">FS</div>
      <div>
        <h1 id="company-display-name" class="text-lg font-bold">Yükleniyor...</h1>
        <p id="user-display-email" class="text-xs text-gray-400">Müşteri Portalı</p>
      </div>
    </div>
    <button onclick="logout()" class="text-xs bg-red-600/20 hover:bg-red-600/40 text-red-400 px-4 py-2 rounded-lg transition">Çıkış Yap</button>
  </header>

  <main class="p-6 max-w-5xl mx-auto space-y-6">

    <!-- AKTİF DUYURU ALANI (Pop-Up / Banner) -->
    <div id="announcement-box" class="hidden bg-blue-600/10 border border-blue-500/30 p-5 rounded-2xl space-y-2">
      <div class="flex items-center gap-2 text-blue-400">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        <h3 id="ann-title-display" class="font-bold text-sm text-blue-300"></h3>
      </div>
      <p id="ann-content-display" class="text-xs text-gray-300 leading-relaxed"></p>
    </div>

    <!-- MÜŞTERİ ÖZET BİLGİSİ -->
    <div class="bg-gray-800 border border-gray-700 p-6 rounded-2xl space-y-4">
      <h2 class="text-base font-bold text-white border-b border-gray-700 pb-3">Hesap Durumu</h2>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm">
        <div class="bg-gray-900/50 p-4 rounded-xl border border-gray-700/50">
          <span class="text-xs text-gray-400 block mb-1">Erişim Durumu</span>
          <span id="status-badge" class="font-semibold text-emerald-400">Aktif</span>
        </div>
        <div class="bg-gray-900/50 p-4 rounded-xl border border-gray-700/50">
          <span class="text-xs text-gray-400 block mb-1">Kullanıcı Rolü</span>
          <span id="role-badge" class="font-semibold text-gray-200">-</span>
        </div>
      </div>
    </div>

  </main>

</body>
</html>
