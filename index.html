<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FSHesap - Giriş Yap</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js" defer></script>
  <script src="auth.js" defer></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md bg-gray-800 border border-gray-700 p-8 rounded-2xl shadow-2xl space-y-6">
    <!-- Logo & Başlık -->
    <div class="text-center space-y-2">
      <div class="w-14 h-14 bg-blue-600 rounded-2xl mx-auto flex items-center justify-center font-bold text-2xl shadow-lg shadow-blue-600/30 text-white">FS</div>
      <h1 class="text-2xl font-bold text-white">FSHesap Girişi</h1>
      <p class="text-xs text-gray-400">Şirket Hesabınıza veya Admin Paneline Giriş Yapın</p>
    </div>

    <!-- Giriş Formu -->
    <form id="login-form" class="space-y-4">
      <div>
        <label class="block text-xs font-medium text-gray-400 mb-1">E-Posta Adresi</label>
        <input type="email" id="login-email" required placeholder="ornek@sirket.com" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-blue-500 transition">
      </div>

      <div>
        <label class="block text-xs font-medium text-gray-400 mb-1">Şifre</label>
        <input type="password" id="login-password" required placeholder="••••••••" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-blue-500 transition">
      </div>

      <div id="login-error" class="hidden text-xs text-rose-400 bg-rose-500/10 p-3 rounded-lg border border-rose-500/20 text-center"></div>

      <button type="submit" id="login-btn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 rounded-xl transition shadow-lg shadow-blue-600/30 text-sm">
        Giriş Yap
      </button>
    </form>
  </div>

</body>
</html>
